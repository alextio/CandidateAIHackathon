name: Deploy Texas map to Pages

# Publishes just frontend/public/texas.html to GitHub Pages, as a standalone
# demo — kept separate from the rest of frontend/public (which is the real
# app's static-assets folder and shouldn't be published wholesale).
on:
  push:
    branches: [main]
    paths:
      - "frontend/public/texas.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage docs/ with just the map demo
        run: |
          mkdir -p docs
          cp frontend/public/texas.html docs/texas.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
