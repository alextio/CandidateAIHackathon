[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
    "uvicorn>=0.52.1",
    # --- Stage classifier (app/classify) ---
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.30",
    # scipy earns two separate keeps: theilslopes (Theil-Sen slope WITH a
    # confidence interval, so no hand-rolled bootstrap) and optimize
    # (temperature scaling).
    "scipy>=1.13",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
