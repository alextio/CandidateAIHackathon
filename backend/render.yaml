# Render Blueprint — deploy from the repo root with this file, or point a new
# Web Service at the `backend/` directory in the dashboard.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: texas-project-discovery
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /docs
    envVars:
      # Set these values in the Render dashboard (marked sync:false so they are
      # NOT stored in git). service_role key is server-side only — never expose.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
